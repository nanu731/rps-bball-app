# LOCAL TESTS ONLY. No hosted project, provider secrets, real records or SMS delivery.
project_id = "teamstats-local"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["com.narayanlekhi.teamstats://auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 3600

# Disabled custom delivery; local email is captured by the local inbox.
[auth.email.smtp]
enabled = false

[auth.sms]
enable_signup = true
enable_confirmations = true
max_frequency = "60s"
template = "LOCAL TEST ONLY: {{ .Code }}"

# Reserved fictional fixture only: native Auth currently rejects it while phone is disabled.
# The configured code is not verified phone authentication or SMS-delivery evidence.
[auth.sms.test_otp]
"15555550101" = "123456"

[auth.sms.twilio]
enabled = false

[auth.sms.twilio_verify]
enabled = false

[auth.sms.messagebird]
enabled = false

[auth.sms.textlocal]
enabled = false

[auth.sms.vonage]
enabled = false

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

[auth.hook.send_sms]
enabled = false

[auth.hook.send_email]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
